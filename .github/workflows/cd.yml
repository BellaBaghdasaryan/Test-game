name: CD

on:
  push:
    branches: [ main ]

jobs:
  check-project:
    name: Check Project Setup
    runs-on: ubuntu-latest
    outputs:
      has-package-json: ${{ steps.check.outputs.has-package-json }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for package.json
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "has-package-json=true" >> $GITHUB_OUTPUT
          else
            echo "has-package-json=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: check-project
    if: github.ref == 'refs/heads/main' && needs.check-project.outputs.has-package-json == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ${{ secrets.CUSTOM_DOMAIN }}
